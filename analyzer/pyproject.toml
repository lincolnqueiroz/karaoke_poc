[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-analyzer"
version = "0.1.0"
description = "Offline music-to-karaoke melody analysis PoC"
requires-python = ">=3.11,<3.16,!=3.12.*,!=3.13.*,!=3.14.*"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "librosa>=0.10.2,<0.12", "soundfile>=0.12,<1", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
separation = ["demucs>=4.0.1,<5"]
dev = ["pytest>=8,<10", "ruff>=0.7"]
packaging = ["pyinstaller>=6,<7"]
youtube = ["yt-dlp[default]>=2025.1.1"]

[project.scripts]
karaoke-analyzer = "karaoke_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
